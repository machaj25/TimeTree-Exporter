# Builds the container image on every push and pull request, and publishes it
# to GitHub Container Registry (ghcr.io/<owner>/timetree-exporter) for pushes
# to main and for version tags. Pull requests only build, they never push.
#
# Needs nothing beyond the repository's GITHUB_TOKEN. The image is private by
# default; make the package public in the repository's Packages settings if
# anonymous `docker pull` should work.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (for arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/timetree-exporter
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build (and push on main or tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the amd64 image
        run: |
          docker buildx build --load -t timetree-exporter:smoke .
          docker run --rm timetree-exporter:smoke --version
          docker run --rm timetree-exporter:smoke --help | grep -q -- --sync-state
          # A usage error must exit with code 3, not a traceback.
          set +e
          docker run --rm timetree-exporter:smoke --public-calendar
          code=$?
          set -e
          test "$code" -eq 3
